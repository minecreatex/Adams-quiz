<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14063a">
<meta name="mobile-web-app-capable" content="yes">
<title>Quiz World – Year 6</title>
<style>
:root{
  --bg1:#14063a;--bg2:#24086b;--card:#2a0f7a;--card2:#341597;--line:rgba(255,255,255,.14);
  --txt:#ffffff;--muted:#c9bdf5;--yellow:#ffd400;--cyan:#00e5ff;--pink:#ff2e93;--lime:#76ff03;
  --green:#00e676;--red:#ff1744;--orange:#ff9100;--blue:#2979ff;
  --r:18px;--nav:70px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;color:var(--txt);
  background:radial-gradient(circle at 15% 0%,#3d0fb0 0%,transparent 45%),radial-gradient(circle at 100% 30%,#7a0a8f 0%,transparent 40%),linear-gradient(180deg,var(--bg1),var(--bg2));
  background-attachment:fixed;min-height:100vh;touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{max-width:980px;margin:0 auto;padding:14px 14px calc(var(--nav) + 26px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0}
h2.sec{font-size:1.25rem;font-weight:900;margin:22px 4px 12px;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.mt{margin-top:12px}.mt2{margin-top:20px}
/* Buttons */
.btn{min-height:52px;padding:12px 18px;border-radius:14px;font-weight:800;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:#4b25c9;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.y{background:var(--yellow);color:#241000}.btn.g{background:var(--green);color:#002b12}.btn.r{background:var(--red)}
.btn.c{background:var(--cyan);color:#002a33}.btn.p{background:var(--pink)}.btn.o{background:var(--orange);color:#2b1300}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid var(--line)}
.btn.block{width:100%}.btn.big{min-height:62px;font-size:1.15rem}.btn.sm{min-height:44px;padding:8px 12px;font-size:.92rem}
.iconbtn{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.12);font-size:1.4rem;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:active{transform:scale(.94)}
/* Hero */
.hero{background:linear-gradient(135deg,#ff2e93 0%,#7c1cff 55%,#2979ff 100%);border-radius:24px;padding:18px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(124,28,255,.45)}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.avatar{width:64px;height:64px;border-radius:20px;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-size:2.1rem;box-shadow:0 4px 0 rgba(0,0,0,.3);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
.hello{font-size:1.45rem;font-weight:900;line-height:1.15;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.rank{font-weight:800;color:#fff3a6}
.xpbar{position:relative;height:26px;border-radius:13px;background:rgba(0,0,0,.35);margin-top:14px;overflow:hidden;z-index:1}
.xpbar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--yellow),var(--lime));border-radius:13px;transition:width .6s}
.xpbar>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:900;text-shadow:0 1px 2px #000}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.stat{background:rgba(0,0,0,.28);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:1.15rem;font-weight:900}
.stat small{font-size:.72rem;font-weight:700;color:#ffe9ff;text-transform:uppercase;letter-spacing:.4px}
@media(min-width:620px){.stats{grid-template-columns:repeat(6,1fr)}}
/* Progress bars */
.bar{height:12px;border-radius:6px;background:rgba(0,0,0,.35);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--lime));transition:width .5s}
.bar.y>i{background:linear-gradient(90deg,var(--yellow),var(--orange))}
.bar.p>i{background:linear-gradient(90deg,var(--pink),#ff6d00)}
/* Subject cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:880px){.grid{grid-template-columns:repeat(4,1fr)}}
.subj{border-radius:20px;padding:14px;text-align:left;min-height:168px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .1s;animation:pop .35s both}
.subj:active{transform:scale(.97) translateY(3px)}
.subj .ic{font-size:2.3rem;line-height:1;width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:900}
.subj .nm{font-weight:900;font-size:1.02rem;line-height:1.15}
.subj .meta{font-size:.78rem;font-weight:700;opacity:.92}
.subj .bar{margin-top:auto;background:rgba(0,0,0,.28)}
.subj .bar>i{background:rgba(255,255,255,.95)}
.subj:after{content:"";position:absolute;right:-26px;bottom:-26px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.14)}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
/* Top bar */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar h1{font-size:1.3rem;font-weight:900;line-height:1.15}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:.78rem;font-weight:800;background:rgba(255,255,255,.14)}
.chip.Easy{background:var(--green);color:#002b12}.chip.Medium{background:var(--orange);color:#2b1300}.chip.Hard{background:var(--red)}
.chip.ok{background:var(--green);color:#002b12}.chip.warn{background:var(--yellow);color:#241000}.chip.bad{background:var(--red)}
.chip.pending{background:var(--yellow);color:#241000}.chip.approved{background:var(--cyan);color:#002a33}.chip.paid{background:var(--green);color:#002b12}.chip.rejected,.chip.cancelled{background:#666}
/* Quiz list */
.chapter{font-weight:900;font-size:1.05rem;margin:18px 2px 8px;color:var(--yellow)}
.topic{font-weight:800;margin:10px 2px 6px;color:var(--cyan);font-size:.92rem}
.quizcard{display:flex;gap:12px;align-items:center}
.quizcard .info{flex:1;min-width:0}
.quizcard .t{font-weight:900;font-size:1.05rem;word-wrap:break-word}
.quizcard .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.list>*+*{margin-top:10px}
/* Quiz engine */
.qhead{display:flex;align-items:center;gap:10px}
.qhead .prog{flex:1}
.qmeta{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem;margin:8px 2px}
.streak{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:rgba(255,145,0,.25);font-weight:900}
.streak.hot{background:linear-gradient(90deg,#ff6d00,#ff1744);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.qcard{background:#fff;color:#1b0a46;border-radius:22px;padding:20px;font-size:1.18rem;font-weight:700;line-height:1.45;box-shadow:0 8px 0 rgba(0,0,0,.3);white-space:pre-wrap;word-wrap:break-word;margin-top:8px}
.qnum{font-size:.85rem;font-weight:900;color:#7c1cff;margin-bottom:6px;white-space:normal}
.opts{display:grid;gap:10px;margin-top:16px}
@media(orientation:landscape) and (min-width:700px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;min-height:64px;border-radius:16px;background:#3a17a8;border:3px solid transparent;font-size:1.05rem;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.35);white-space:pre-wrap;word-wrap:break-word}
.opt:active{transform:translateY(3px)}
.opt .L{flex:0 0 42px;height:42px;border-radius:12px;background:var(--yellow);color:#241000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.15rem}
.opt .tx{flex:1;min-width:0}
.opt.right{background:#00a152;border-color:var(--lime)}
.opt.right .L{background:#fff;color:#00a152}
.opt.wrong{background:#c4001d;border-color:#ff8a80}
.opt.wrong .L{background:#fff;color:#c4001d}
.opt.dim{opacity:.55}
.opts.locked .opt{pointer-events:none}
.fb{border-radius:18px;padding:16px;margin-top:14px;animation:pop .3s both}
.fb.ok{background:linear-gradient(135deg,#00c853,#00897b)}
.fb.bad{background:linear-gradient(135deg,#ff1744,#d500f9)}
.fb h3{font-size:1.3rem;font-weight:900}
.fb .ex{margin-top:8px;background:rgba(0,0,0,.22);border-radius:12px;padding:10px;white-space:pre-wrap;font-weight:600;line-height:1.4}
.timer{min-width:62px;text-align:center;padding:6px 10px;border-radius:12px;background:rgba(0,0,0,.35);font-weight:900}
.timer.low{background:var(--red);animation:pulse .6s infinite}
.xpfloat{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-size:2rem;font-weight:900;color:var(--yellow);text-shadow:0 3px 0 #000;z-index:900;pointer-events:none;animation:floatup 1.1s ease-out forwards}
@keyframes floatup{from{opacity:0;transform:translate(-50%,20px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}to{opacity:0;transform:translate(-50%,-90px) scale(1)}}
/* Results */
.ring{width:170px;height:170px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;position:relative}
.ring .in{width:132px;height:132px;border-radius:50%;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:2.2rem;font-weight:900}
.resgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.resbox{background:rgba(0,0,0,.25);border-radius:14px;padding:12px;text-align:center}
.resbox b{display:block;font-size:1.35rem;font-weight:900}
.note{background:rgba(0,0,0,.25);border-left:5px solid var(--cyan);border-radius:10px;padding:10px 12px;font-size:.92rem;line-height:1.4}
.note.warn{border-color:var(--yellow)}.note.bad{border-color:var(--red)}.note.ok{border-color:var(--green)}
/* Review */
.rv{border-radius:16px;padding:14px;background:rgba(0,0,0,.22);border-left:6px solid var(--green)}
.rv.bad{border-left-color:var(--red)}
.rv .q{font-weight:800;white-space:pre-wrap;word-wrap:break-word}
.rv .a{margin-top:6px;font-size:.95rem;white-space:pre-wrap;word-wrap:break-word}
/* Badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:620px){.badges{grid-template-columns:repeat(5,1fr)}}
.badge{border-radius:16px;padding:12px 8px;text-align:center;background:rgba(0,0,0,.25);border:2px solid var(--line)}
.badge .bi{font-size:2.2rem}
.badge .bn{font-weight:900;font-size:.85rem;margin-top:4px}
.badge .bd{font-size:.72rem;color:var(--muted);margin-top:2px}
.badge.on{background:linear-gradient(160deg,#ffd400,#ff6d00);color:#241000;border-color:#fff3a6}
.badge.on .bd{color:#3b1d00}
.badge.off .bi{filter:grayscale(1);opacity:.45}
/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(15,4,45,.96);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
.nav .in{display:flex;max-width:980px;width:100%}
.nav button{flex:1;height:var(--nav);background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:800;color:var(--muted);position:relative}
.nav button .e{font-size:1.5rem}
.nav button.on{color:var(--yellow)}
.nav button.on:before{content:"";position:absolute;top:0;left:25%;right:25%;height:4px;border-radius:0 0 4px 4px;background:var(--yellow)}
.dot{position:absolute;top:8px;right:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:.7rem;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* Forms */
label.f{display:block;font-weight:800;font-size:.88rem;margin:12px 0 6px}
.in-f{width:100%;min-height:50px;padding:12px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.3);font-size:1rem;color:#fff}
.in-f:focus{outline:none;border-color:var(--cyan)}
textarea.in-f{min-height:110px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:.88rem}
textarea.in-f.txt{font-family:inherit;font-size:1rem}
select.in-f{appearance:auto}
select.in-f option{color:#000}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input[type=color].in-f{padding:4px;height:50px}
input[type=checkbox].ck{width:26px;height:26px;accent-color:var(--yellow)}
/* Tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;min-height:46px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:800;white-space:nowrap}
.tabs button.on{background:var(--yellow);color:#241000}
/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{color:var(--muted);font-size:.75rem;text-transform:uppercase}
.scrollx{overflow-x:auto}
/* PIN */
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:330px;margin:16px auto}
.pinpad button{height:72px;border-radius:20px;background:#4b25c9;font-size:1.7rem;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.pinpad button:active{transform:translateY(3px)}
.pindots{display:flex;justify-content:center;gap:12px;margin:14px 0}
.pindots i{width:20px;height:20px;border-radius:50%;border:3px solid #fff}
.pindots i.f{background:var(--yellow);border-color:var(--yellow)}
/* Modal + toast */
.mback{position:fixed;inset:0;background:rgba(5,0,20,.75);z-index:600;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@media(min-width:620px){.mback{align-items:center}}
.modal{background:linear-gradient(160deg,#3a17a8,#24086b);border:1px solid var(--line);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s}
@media(min-width:620px){.modal{border-radius:24px}}
.modal h3{font-size:1.25rem;font-weight:900;margin-bottom:10px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
#toast-root{position:fixed;left:0;right:0;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom));z-index:700;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:#111;border:2px solid var(--cyan);border-radius:14px;padding:12px 16px;font-weight:800;max-width:520px;box-shadow:0 6px 18px rgba(0,0,0,.5);animation:up .25s}
.toast.bad{border-color:var(--red)}.toast.ok{border-color:var(--green)}.toast.gold{border-color:var(--yellow)}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:950;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}
.banner{border-radius:14px;padding:12px 14px;font-weight:700;font-size:.9rem;margin-bottom:12px;line-height:1.4}
.banner.warn{background:var(--yellow);color:#241000}.banner.bad{background:var(--red)}.banner.info{background:rgba(0,229,255,.18);border:1px solid var(--cyan)}
.empty{text-align:center;padding:30px 16px}
.empty .e{font-size:3rem}
.mbars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px}
.mbars .mb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.mbars .mb i{display:block;width:100%;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--yellow),var(--pink));min-height:3px}
.mbars .mb small{font-size:.68rem;color:var(--muted);font-weight:800}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{text-align:right}
.qrow{display:flex;gap:8px;align-items:flex-start;padding:10px;border-radius:12px;background:rgba(0,0,0,.22)}
.qrow+.qrow{margin-top:8px}
.qrow .qt{flex:1;min-width:0;font-size:.92rem;white-space:pre-wrap;word-wrap:break-word}
.err{color:#ff8a80;font-size:.85rem}
.warnt{color:#ffe57f;font-size:.85rem}
.wallet-hero{background:linear-gradient(135deg,#00c853,#00b8d4 60%,#2979ff);border-radius:24px;padding:18px;box-shadow:0 10px 30px rgba(0,200,83,.35)}
.wallet-hero .big{font-size:2.4rem;font-weight:900;line-height:1}
.redeem{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.redeem{grid-template-columns:repeat(3,1fr)}}
.redeem .btn{flex-direction:column;min-height:78px;gap:2px}
.redeem .btn small{font-size:.72rem;font-weight:700;opacity:.9}
.req{display:flex;align-items:center;gap:8px}
.req .ic{font-size:1.3rem;width:30px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="nav-root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<input type="file" id="filepick" multiple style="display:none">
<!-- ================= BUILT-IN QUIZZES =================
     Quizzes placed in this block are part of the file itself:
     they load offline with no import, and come back even if Chrome data is cleared.

function ink(hex){const h=String(hex||'#000').replace('#','');const n=parseInt(h.length===3?h.split('').map(x=>x+x).join(''):h,16);const r=(n>>16)&255,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)>170?'#1a0d00':'#ffffff'}
function shade(hex,p){const h=String(hex||'#000').replace('#','');let n=parseInt(h,16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.max(0,Math.min(255,Math.round(r*(1+p))));g=Math.max(0,Math.min(255,Math.round(g*(1+p))));b=Math.max(0,Math.min(255,Math.round(b*(1+p))));return '#'+[r,g,b].map(x=>pad(x.toString(16))).join('')}

let S=null, storageOK=true, loadWarning='';

    meta:{lastBackupAt:null,pinFails:0,pinLockUntil:0,pinResetAt:null,nameSet:false}};
}
function migrate(d){
  const f=freshState(); if(!d||typeof d!=='object') return f;
  const o={...f,...d};
  o.settings={...f.settings,...(d.settings||{})};
  o.settings.eligibility={...f.settings.eligibility,...((d.settings&&d.settings.eligibility)||{})};
  ['boosters','rpTiers','redemptions'].forEach(k=>{if(!Array.isArray(o.settings[k])||!o.settings[k].length)o.settings[k]=clone(f.settings[k])});
  o.progress={...f.progress,...(d.progress||{})};
  o.progress.dayStreak={...f.progress.dayStreak,...(o.progress.dayStreak||{})};
  ['attempts'].forEach(k=>{if(!Array.isArray(o.progress[k]))o.progress[k]=[]});
  ['quizStats','wrongBank','badges','monthly'].forEach(k=>{if(!o.progress[k]||typeof o.progress[k]!=='object')o.progress[k]={}});
  o.wallet={...f.wallet,...(d.wallet||{})}; if(!Array.isArray(o.wallet.transactions))o.wallet.transactions=[];
  o.meta={...f.meta,...(d.meta||{})};if(!d.meta||d.meta.nameSet===undefined)o.meta.nameSet=true;
  if(!Array.isArray(o.subjects)||!o.subjects.length) o.subjects=f.subjects;
  if(!o.quizzes||typeof o.quizzes!=='object'||Array.isArray(o.quizzes)) o.quizzes={};
  o.schema=SCHEMA; o.appVersion=APP_VERSION;
  return o;
}

    try{S=migrate(JSON.parse(raw));return}
    catch(e){try{localStorage.setItem(STORE_KEY+'_corrupt_'+Date.now(),raw)}catch(_){} loadWarning='Saved data could not be read and was set aside (kept as a corrupt copy). Restore from your latest backup in Parent Mode.';}
  }
  S=freshState(); save();
}

/* ------------------------------ Core calcs ------------------------------ */
const subjById=id=>S.subjects.find(s=>s.id===id);
function subjectName(id){const s=subjById(id);return s?s.name:'(Unknown subject)'}
function findSubject(name){const n=norm(name);if(!n)return null;return S.subjects.find(s=>norm(s.name)===n||norm(s.short)===n||norm(s.id)===n||(s.aliases||[]).some(a=>norm(a)===n))||null}
function visibleSubjects(){return S.subjects.filter(s=>!s.hidden).sort((a,b)=>a.order-b.order)}
function allSubjectsSorted(){return S.subjects.slice().sort((a,b)=>a.order-b.order)}
function quizzesOf(sid){return sortQuizzes(Object.values(S.quizzes).filter(q=>q.subjectId===sid))}
function sortQuizzes(a){return a.sort((x,y)=>natCmp(x.chapter,y.chapter)||natCmp(x.topic,y.topic)||natCmp(x.title,y.title)||natCmp(x.quizId,y.quizId))}
function xpTo(L){return 50*(L-1)*L}
function levelInfo(xp){let L=1;while(xp>=xpTo(L+1))L++;const base=xpTo(L),next=xpTo(L+1);return {level:L,cur:xp-base,need:next-base,next,title:TITLES[Math.min(TITLES.length-1,Math.floor((L-1)/2))]}}
function multFor(streak){const b=S.settings.boosters.slice().sort((a,c)=>c.streak-a.streak);for(const x of b){if(streak>=x.streak)return x.mult}return 1}
function rpTierFor(correct,total){
  if(!total) return 0;
  const tiers=S.settings.rpTiers.slice().sort((a,b)=>b.min-a.min);
  for(const t of tiers){ if(correct*100>=t.min*total) return t.rp } // exact integer comparison, no rounding up
  return 0;
}
function rpForResult(correct,total){
  const tier=rpTierFor(correct,total), std=S.settings.standardQuestions;
  if(total<std) return Math.floor(tier*total/std);
  return tier;
}
function maxRpFor(total){return rpForResult(total,total)}
function monthRec(mk){const m=S.progress.monthly;if(!m[mk])m[mk]={rpEarned:0};return m[mk]}
function normalAttempts(){return S.progress.attempts.filter(a=>a.mode==='normal')}

function pendingTx(){return S.wallet.transactions.filter(t=>t.status==='pending')}
function reservedRP(){return pendingTx().reduce((s,t)=>s+t.rp,0)}
function redeemedRM(mk){return S.wallet.transactions.filter(t=>(t.status==='approved'||t.status==='paid')&&t.approvedMonth===mk).reduce((s,t)=>s+t.rm,0)}

function cashPaid(){return S.wallet.transactions.filter(t=>t.status==='paid').reduce((s,t)=>s+t.rm,0)}
function cashOwed(){return S.wallet.transactions.filter(t=>t.status==='approved').reduce((s,t)=>s+t.rm,0)}
function eligibility(mk=monthKey()){
  const e=S.settings.eligibility, at=normalAttempts().filter(a=>a.month===mk);
  const uq=new Set(),hi=new Set(),sb=new Set();
  at.forEach(a=>{uq.add(a.quizId);sb.add(a.subjectId);if(a.correct*100>=e.highScorePct*a.total)hi.add(a.quizId)});
  const r={unique:uq.size,high:hi.size,subjects:sb.size,needU:e.uniqueQuizzes,needH:e.highScoreQuizzes,needS:e.subjects,pct:e.highScorePct};
  r.ok=r.unique>=r.needU&&r.high>=r.needH&&r.subjects>=r.needS; return r;
}
function dayStreakNow(){const d=S.progress.dayStreak;if(!d.last)return 0;const t=dayKey(),y=dayKey(new Date(Date.now()-864e5));return (d.last===t||d.last===y)?d.count:0}
function subjectStats(sid){
  const qs=quizzesOf(sid);let done=0,best=null;
  qs.forEach(q=>{const st=S.progress.quizStats[q.quizId];if(st&&st.attempts>0){done++;best=Math.max(best??0,st.bestPct)}});
  const at=normalAttempts().filter(a=>a.subjectId===sid);const c=at.reduce((s,a)=>s+a.correct,0),t=at.reduce((s,a)=>s+a.total,0);
  return {count:qs.length,done,best,acc:t?c*100/t:null,answered:t,attempts:at.length};
}
function overallAcc(){const at=normalAttempts();const c=at.reduce((s,a)=>s+a.correct,0),t=at.reduce((s,a)=>s+a.total,0);return t?c*100/t:null}
function uniqueCompleted(){return Object.keys(S.progress.quizStats).filter(k=>S.progress.quizStats[k].attempts>0).length}
function wrongItems(f={}){
  const out=[];for(const [qzId,map] of Object.entries(S.progress.wrongBank)){const quiz=S.quizzes[qzId];if(!quiz)continue;
    if(f.subjectId&&quiz.subjectId!==f.subjectId)continue;if(f.quizId&&qzId!==f.quizId)continue;
    for(const qid of Object.keys(map)){const q=quiz.questions.find(x=>x.id===qid);if(q)out.push({quizId:qzId,q})}}
  return out;
}
function badgeCtx(){

  at.forEach(a=>{const p=a.correct/a.total;best[a.quizId]=Math.max(best[a.quizId]||0,p)});
  return {unique:Object.keys(best).length,perfects:at.filter(a=>a.correct===a.total).length,bestStreak:P.bestAnswerStreak,
    ace:Object.values(best).filter(p=>p*100>=80).length,subjects:new Set(at.map(a=>a.subjectId)).size,level:levelInfo(P.xp).level,
    rp:P.rpEarnedTotal,days:P.dayStreak.best,revisions:P.attempts.filter(a=>a.mode==='revision').length,

}

let AC=null;
function beep(type){
  if(!S.settings.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const seq=type==='ok'?[[660,0],[880,.09]]:type==='bad'?[[230,0],[170,.13]]:[[523,0],[659,.1],[784,.2],[1047,.32]];
    seq.forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;const s=AC.currentTime+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.22,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.2);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+.22)})}catch(e){}
}

/* ---------- QUIZ ENGINE ---------- */
let timerInt=null;
function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null}}
function newSession(mode,items,meta){
  return {id:uid('S'),mode,items,idx:0,answers:[],correct:0,streak:0,bestStreak:0,xp:0,startedAt:nowISO(),finished:false,abandoned:false,committed:false,deadlines:{},...meta};
}
function startQuiz(quizId,mode='normal',replace=false){
  const quiz=S.quizzes[quizId]; if(!quiz||!quiz.questions.length){toast('Quiz not found','bad');return}
  session=newSession(mode,quiz.questions.map(q=>({quizId,q})),{quizId,subjectId:quiz.subjectId,title:quiz.title});
  if(mode==='normal'){const st=ensureStats(quizId);st.started=(st.started||0)+1;save()}
  go('quiz',{},{replace});
}
function startRevision(f,title,replace=false){
  const items=wrongItems(f); if(!items.length){toast('No mistakes to revise – great job! 🎉','ok');return}
  const subjectId=f.subjectId||(f.quizId&&S.quizzes[f.quizId]?S.quizzes[f.quizId].subjectId:null);
  session=newSession('revision',items,{quizId:f.quizId||null,subjectId,title});
  go('quiz',{},{replace});
}
function ensureStats(qid){const Q=S.progress.quizStats;if(!Q[qid])Q[qid]={started:0,attempts:0,bestPct:-1,bestCorrect:0,bestTotal:0,latestPct:null,latestAt:null,rpAwarded:0,firstCompletedAt:null};return Q[qid]}
function vQuiz(){
  const s=session; if(!s) return vHome();
  const it=s.items[s.idx], q=it.q, a=s.answers[s.idx], n=s.items.length, mult=multFor(s.streak);
  const modeChip=s.mode==='revision'?'<span class="chip warn">🔁 Revision</span>':s.mode==='preview'?'<span class="chip warn">👁️ Parent preview</span>':'';
  const subj=subjById(s.subjectId);
  let html=`<div class="qhead"><button class="iconbtn" data-a="exitQuiz" aria-label="Exit">✖️</button>
    <div class="prog"><div class="small" style="font-weight:800;margin-bottom:4px" dir="auto">${esc(s.title)}</div><div class="bar y"><i style="width:${(s.idx+(a?1:0))*100/n}%"></i></div></div>
    ${S.settings.timerEnabled?`<div class="timer" id="timer">⏱️</div>`:''}</div>
  <div class="qmeta"><span>Question ${s.idx+1} / ${n}</span><span>✅ ${s.correct} · ⚡ ${s.xp} XP</span></div>
  <div class="row">${modeChip}${subj?`<span class="chip">${esc(subj.icon)} ${esc(subj.short||subj.name)}</span>`:''}<span class="streak ${mult>1?'hot':''}">🔥 ${s.streak}${mult>1?` · ${mult}× XP`:''}</span></div>
  <div class="qcard" dir="auto"><div class="qnum">${s.mode==='revision'?esc(S.quizzes[it.quizId]?.title||''):''} #${esc(q.id)}</div>${esc(q.question)}</div>
  <div class="opts ${a?'locked':''}">`;
  LETTERS.forEach(L=>{
    let cls='';
    if(a){ if(L===q.answer)cls='right'; else if(L===a.chosen)cls='wrong'; else cls='dim'; }
    html+=`<button class="opt ${cls}" data-a="answer" data-l="${L}" ${a?'disabled':''}><span class="L">${L}</span><span class="tx" dir="auto">${esc(q.options[L])}</span></button>`;
  });
  html+=`</div>`;
  if(a){
    const last=s.idx===n-1;
    html+=a.correct?`<div class="fb ok"><h3>🎉 Correct! +${a.xp} XP${a.mult>1?` <span class="chip warn">${a.mult}× booster</span>`:''}</h3>`
      :`<div class="fb bad"><h3>${a.chosen?'😅 Not quite!':'⏰ Time is up!'}</h3><div style="font-weight:800;margin-top:4px">Correct answer: ${q.answer} – <span dir="auto">${esc(q.options[q.answer])}</span></div>`;
    html+=(q.explanation?`<div class="ex" dir="auto">💡 ${esc(q.explanation)}</div>`:'')+linkHTML(q,'btn ghost sm mt')+`</div>
      <button class="btn ${last?'g':'c'} block big mt" data-a="nextQ">${last?'🏁 SEE RESULTS':'NEXT ➜'}</button>`;
  }
  return html;
}
function afterQuizRender(){
  const s=session; stopTimer();
  if(!s||s.answers[s.idx]||!S.settings.timerEnabled) return;
  if(!s.deadlines[s.idx]) s.deadlines[s.idx]=Date.now()+S.settings.timerSeconds*1000;
  const tick=()=>{const el=$('#timer');const left=Math.max(0,Math.ceil((s.deadlines[s.idx]-Date.now())/1000));
    if(el){el.textContent='⏱️ '+left+'s';el.classList.toggle('low',left<=5)}
    if(left<=0){stopTimer();choose(null)}};
  tick(); timerInt=setInterval(tick,250);
}
function choose(letter){
  const s=session; if(!s||s.finished||s.answers[s.idx]) return;
  stopTimer();
  const it=s.items[s.idx], ok=letter!==null&&letter===it.q.answer;
  let gain=0,mult=1;
  if(ok){s.correct++;s.streak++;s.bestStreak=Math.max(s.bestStreak,s.streak);mult=multFor(s.streak);gain=S.settings.xpBase*mult;s.xp+=gain}
  else s.streak=0;
  s.answers[s.idx]={quizId:it.quizId,qid:it.q.id,chosen:letter,correct:ok,xp:gain,mult};
  render();
  if(ok){beep('ok');xpFloat('+'+gain+' XP');const bs=S.settings.boosters.find(b=>b.streak===s.streak);if(bs)toast(`🔥 ${s.streak} in a row! ${bs.mult}× XP booster!`,'gold')}
  else{beep('bad');buzz(120)}
}
function nextQ(){
  const s=session; if(!s||!s.answers[s.idx]) return;
  if(s.idx<s.items.length-1){s.idx++;render();window.scrollTo(0,0);return}
  s.finished=true; lastResult=commitSession(s); go('results',{},{replace:true});
  if(lastResult.pct>=80)confetti(lastResult.pct===100?140:80);
  beep('win');
  if(lastResult.levelUp)setTimeout(()=>{confetti(100);modal(`<div class="center"><div style="font-size:4rem">🆙</div><h3>LEVEL UP!</h3><p style="font-size:1.2rem;font-weight:800">You reached Level ${lastResult.newLevel} – ${esc(levelInfo(S.progress.xp).title)}!</p><button class="btn y block big" data-a="mcancel">AWESOME!</button></div>`)},700);
}
function commitSession(s){
  if(s.committed) return s.result;
  s.committed=true;
  const P=S.progress,total=s.items.length,correct=s.correct,pct=correct*100/total,mk=monthKey();
  const res={mode:s.mode,total,correct,pct,xp:0,rp:0,rpEntitled:0,rpNote:'',rpKind:'info',newBadges:[],levelUp:false,newLevel:0,prevBest:null,newBest:false,bestStreak:s.bestStreak};
  if(s.mode==='preview'){res.xp=s.xp;res.rpNote='Parent preview – nothing was recorded.';s.result=res;return res}
  if(P.attempts.some(a=>a.sessionId===s.id)){s.result=res;return res} // duplicate guard
  const lvlBefore=levelInfo(P.xp).level;
  P.xp+=s.xp;res.xp=s.xp;
  P.bestAnswerStreak=Math.max(P.bestAnswerStreak,s.bestStreak);
  const WB=P.wrongBank;
  s.answers.forEach(a=>{
    if(!a.correct){WB[a.quizId]=WB[a.quizId]||{};const o=WB[a.quizId][a.qid]||{count:0};WB[a.quizId][a.qid]={count:o.count+1,last:nowISO()}}
    else if(WB[a.quizId]&&WB[a.quizId][a.qid]){delete WB[a.quizId][a.qid];if(!Object.keys(WB[a.quizId]).length)delete WB[a.quizId]}
  });
  if(s.mode==='normal'){
    const st=ensureStats(s.quizId);
    res.prevBest=st.attempts>0?st.bestPct:null;
    st.attempts++;st.latestPct=pct;st.latestAt=nowISO();if(!st.firstCompletedAt)st.firstCompletedAt=nowISO();
    if(pct>st.bestPct){res.newBest=res.prevBest!==null;st.bestPct=pct;st.bestCorrect=correct;st.bestTotal=total}
    const entitled=rpForResult(correct,total);res.rpEntitled=entitled;
    const already=st.rpAwarded||0, diff=Math.max(0,entitled-already);
    const m=monthRec(mk), remaining=Math.max(0,S.settings.monthlyRpCap-m.rpEarned);
    const award=Math.min(diff,remaining);
    st.rpAwarded=already+award; m.rpEarned+=award; P.rpEarnedTotal+=award; res.rp=award;
    if(entitled===0){res.rpNote=`Score at least ${Math.min(...S.settings.rpTiers.map(t=>t.min))}% to earn RP.${total<S.settings.standardQuestions?` (Short quiz: RP is scaled to ${total}/${S.settings.standardQuestions} questions.)`:''}`;res.rpKind='warn'}
    else if(award>0&&award===diff){res.rpNote=already?`New best! You earned the extra ${award} RP (your RP for this quiz is now ${st.rpAwarded}).`:`You earned ${award} RP for this quiz!`;res.rpKind='ok'}
    else if(award<diff){res.rpNote=`Monthly RP limit (${fmtN(S.settings.monthlyRpCap)}) reached. ${award} RP added; ${diff-award} RP could not be added this month – match this score again next month to collect it.`;res.rpKind='warn'}
    else {res.rpNote=`No new RP: you already collected ${already} RP from this quiz. Beat your best score to earn more!`;res.rpKind='info'}
    if(total<S.settings.standardQuestions&&entitled>0)res.rpNote+=` (Short quiz: RP scaled to ${total}/${S.settings.standardQuestions} questions, rounded down.)`;
  } else {res.rpNote='Revision sessions earn XP only – no RP.';res.rpKind='info'}
  P.attempts.push({sessionId:s.id,quizId:s.quizId,subjectId:s.subjectId,mode:s.mode,at:nowISO(),month:mk,correct,total,pct:Math.round(pct*10)/10,xp:s.xp,rp:res.rp,bestStreak:s.bestStreak,
    wrong:s.answers.filter(a=>!a.correct).map(a=>({quizId:a.quizId,qid:a.qid,chosen:a.chosen}))});
  const d=P.dayStreak,t=dayKey(),y=dayKey(new Date(Date.now()-864e5));
  if(d.last!==t){d.count=(d.last===y)?d.count+1:1;d.last=t;d.best=Math.max(d.best,d.count)}
  const lvlAfter=levelInfo(P.xp).level; if(lvlAfter>lvlBefore){res.levelUp=true;res.newLevel=lvlAfter}
  res.newBadges=checkBadges();
  save(); s.result=res; return res;
}
async function askExitQuiz(){
  const s=session; if(!s) return;
  const ok=await confirmBox({title:'Leave this quiz?',body:s.mode==='preview'?'End the preview?':'Your answers in this attempt will be lost and no XP or RP will be given.',ok:'Leave',cancel:'Keep playing',danger:true});

}

function redeemState(opt){
  const st=S.settings, el=eligibility(), mk=monthKey(), av=availableRP()-reservedRP(), used=redeemedRM(mk);
  if(pendingTx().length) return 'Request pending';

}

function txRow(t,parent){
  const icon={pending:'⏳',approved:'✅',paid:'💵',rejected:'❌',cancelled:'🚫'}[t.status]||'•';

  if(parent&&t.status==='approved') act=`<button class="btn g sm block mt" data-a="pPaid" data-id="${t.id}">💵 Mark as Paid</button>`;

  return `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="req"><span class="ic">${icon}</span><div class="grow"><b>${RM(t.rm)}</b> · ${fmtN(t.rp)} RP <span class="chip ${t.status}">${t.status.toUpperCase()}</span>

   ${t.note?`<div class="small">📝 ${esc(t.note)}</div>`:''}</div></div>${act}</div>`;
}

async function pinPress(d){
  if(S.meta.pinLockUntil>Date.now()){toast('Locked – please wait','bad');return}
  if(d==='del'){pinBuf=pinBuf.slice(0,-1);render();return}
  if(d==='ok'){
    if(pinBuf===String(S.settings.pin)){pinBuf='';S.meta.pinFails=0;save();parentUnlocked=true;view={name:'parent',params:{tab:'overview'}};render();
      if(S.settings.pinIsDefault)toast('Please change the default PIN (1234) in Settings','gold',4000)}
    else{pinBuf='';S.meta.pinFails=(S.meta.pinFails||0)+1;if(S.meta.pinFails>=5){S.meta.pinLockUntil=Date.now()+60000;S.meta.pinFails=0}save();buzz(200);toast('Wrong PIN','bad');render()}
    return;
  }
  if(pinBuf.length<8){pinBuf+=d;render()}
}

/* ------------------------------ Validation & Import ------------------------------ */
function validateQuiz(raw,idx){
  const errors=[],warnings=[];
  if(!raw||typeof raw!=='object'||Array.isArray(raw)) return {errors:[`Item #${idx+1} is not a quiz object`],warnings,quiz:null};
  const quizId=String(raw.quizId??'').trim();
  if(!quizId)errors.push('Missing "quizId"');else if(!/^[A-Za-z0-9._-]+$/.test(quizId))errors.push('"quizId" may only use letters, numbers, dot, dash and underscore');
  const subject=String(raw.subject??'').trim();if(!subject)errors.push('Missing "subject"');
  const title=String(raw.title??'').trim();if(!title)errors.push('Missing "title"');
  let difficulty=String(raw.difficulty??'').trim();
  if(!difficulty){difficulty='Medium';warnings.push('No "difficulty" – set to Medium')}else{const l=difficulty.toLowerCase();if(['easy','medium','hard'].includes(l))difficulty=l[0].toUpperCase()+l.slice(1);else warnings.push(`Unusual difficulty "${difficulty}"`)}
  let year=raw.year; if(year==null||year===''){year=6;warnings.push('No "year" – set to 6')}else{year=Number(year);if(!Number.isFinite(year)){errors.push('"year" must be a number');year=6}else if(year!==6)warnings.push(`Year is ${year}, not 6`)}
  let chapter=String(raw.chapter??'').trim();if(!chapter){chapter='General';warnings.push('No "chapter" – set to General')}
  const topic=String(raw.topic??'').trim();
  const qs=[],ids=new Set();
  if(!Array.isArray(raw.questions)||!raw.questions.length)errors.push('"questions" must be a non-empty list');
  (Array.isArray(raw.questions)?raw.questions:[]).forEach((q,i)=>{
    const pre=`Q${i+1}: `;
    if(!q||typeof q!=='object'||Array.isArray(q)){errors.push(pre+'is not an object');return}
    let id=String(q.id??'').trim();
    if(!id){id=(quizId||'Q')+'-Q'+pad(i+1,3);warnings.push(pre+`no "id" – assigned ${id}`)}
    if(ids.has(id))errors.push(pre+`duplicate question id "${id}"`);ids.add(id);
    const text=String(q.question??'').trim();if(!text)errors.push(pre+'missing "question" text');
    const o={};const opts=q.options;
    if(Array.isArray(opts)){if(opts.length!==4)errors.push(pre+'needs exactly 4 options');LETTERS.forEach((L,k)=>o[L]=String(opts[k]??'').trim())}
    else if(opts&&typeof opts==='object'){for(const k of Object.keys(opts)){const K=k.trim().toUpperCase();if(!LETTERS.includes(K))errors.push(pre+`unexpected option "${k}" (only A–D allowed)`);else o[K]=String(opts[k]??'').trim()}}
    else errors.push(pre+'missing "options"');
    LETTERS.forEach(L=>{if(opts&&!o[L])errors.push(pre+`option ${L} is missing or empty`)});
    const vals=LETTERS.map(L=>o[L]).filter(Boolean);if(new Set(vals).size<vals.length)warnings.push(pre+'two options have the same text');
    const ans=String(q.answer??'').trim().toUpperCase();if(!LETTERS.includes(ans))errors.push(pre+'"answer" must be A, B, C or D');
    const ex=String(q.explanation??'').trim();if(!ex)warnings.push(pre+'no explanation');
    const link=String(q.link??'').trim(),linkText=String(q.linkText??'').trim();
    if(link&&!/^https?:\/\/[^\s]+$/i.test(link))errors.push(pre+'"link" must be a full web address starting with http:// or https://');
    if(linkText&&!link)warnings.push(pre+'"linkText" given without "link" – ignored');
    const rec={id,question:text,options:{A:o.A||'',B:o.B||'',C:o.C||'',D:o.D||''},answer:ans,explanation:ex};
    if(link){rec.link=link;if(linkText)rec.linkText=linkText}
    qs.push(rec);
  });
  return {errors,warnings,quiz:{quizId,subject,year,chapter,topic,title,difficulty,questions:qs}};
}
function sameQuizContent(a,b){const strip=q=>JSON.stringify({t:q.title,c:q.chapter,tp:q.topic||'',d:q.difficulty,y:q.year,qs:q.questions});return strip(a)===strip(b)}
function parseJSONText(txt){
  txt=String(txt||'').replace(/^﻿/,'').trim();
  if(!txt) throw new Error('The text is empty.');
  try{return JSON.parse(txt)}catch(e){
    let m=String(e.message);const pos=/position (\d+)/.exec(m);
    if(pos){const p=+pos[1];const line=txt.slice(0,p).split('\n').length;m+=` (around line ${line}: "${txt.slice(Math.max(0,p-25),p+25).replace(/\s+/g,' ')}")`}
    throw new Error('Invalid JSON – '+m);
  }
}
function extractQuizList(obj){
  if(Array.isArray(obj))return obj;
  if(obj&&typeof obj==='object'){if(Array.isArray(obj.quizzes))return obj.quizzes;return [obj]}
  return null;
}
function handleImportPayloads(payloads){
  // payloads: [{name, text}]
  const items=[],fileErrors=[];let backup=null;
  payloads.forEach(p=>{
    let obj;try{obj=parseJSONText(p.text)}catch(e){fileErrors.push(`${p.name}: ${e.message}`);return}
    if(obj&&obj.type===BACKUP_TYPE){backup={obj,name:p.name};return}
    const list=extractQuizList(obj);if(!list){fileErrors.push(`${p.name}: not a quiz, quiz list or backup`);return}
    list.forEach((raw,i)=>items.push({src:p.name,raw,v:validateQuiz(raw,i)}));
  });
  if(backup&&!items.length){beginRestore(backup.obj,backup.name);return}
  if(!items.length){alertBox('Nothing imported',`<div class="err">${fileErrors.map(esc).join('<br>')||'No quizzes found.'}</div>`);return}
  const seen=new Set();
  items.forEach(it=>{
    if(it.v.errors.length){it.status='invalid';it.action='skip';return}
    const id=it.v.quiz.quizId,subj=findSubject(it.v.quiz.subject);
    it.subj=subj;
    if(seen.has(id)){it.status='batchdup';it.action='skip'}
    else if(S.quizzes[id]){it.status=sameQuizContent(S.quizzes[id],it.v.quiz)&&S.quizzes[id].subjectId===(subj&&subj.id)?'identical':'dup';it.action='skip'}
    else{it.status='new';it.action='import'}
    seen.add(id);
  });
  pendingImport={items,fileErrors,backupIgnored:!!backup};
  showImportPreview();
}

      ${it.v.warnings.length?`<div class="warnt">${it.v.warnings.slice(0,4).map(esc).join('<br>')}${it.v.warnings.length>4?`<br>…and ${it.v.warnings.length-4} more notes`:''}</div>`:''}${ctl}</div>`}).join('');
  const willReplace=P.items.some(i=>i.action==='replace');
  modal(`<h3>📥 Import preview</h3><p class="small">${ok} new · ${dup} duplicate · ${bad} invalid</p>
   ${P.fileErrors.length?`<div class="err">${P.fileErrors.map(esc).join('<br>')}</div>`:''}${P.backupIgnored?'<div class="warnt">A backup file was included – restore it separately from 💾 Backup.</div>':''}
   <div style="max-height:52vh;overflow-y:auto">${rows}</div>
   ${willReplace?`<label class="row mt small"><input type="checkbox" class="ck" id="imp-ack"> I understand that replacing changes the existing quiz content. ${esc(SN())}'s scores and RP for that quiz ID are kept.</label>`:''}
   <div class="two mt2"><button class="btn ghost" data-a="mcancel">Cancel</button><button class="btn g" data-a="commitImport">Import selected</button></div>`);

function uniqueQuizId(base){let n=2,id=base+'-COPY';while(S.quizzes[id]){id=base+'-COPY'+n;n++}return id}
function commitImport(){
  const P=pendingImport;if(!P)return;
  if(P.items.some(i=>i.action==='replace')&&!($('#imp-ack')&&$('#imp-ack').checked)){toast('Tick the confirmation box to replace quizzes','bad');return}
  if(P.items.some(i=>i.action==='replace'))snapshotPrev('Before replacing quiz content');
  let added=0,replaced=0,copied=0,skipped=0;const newSubj={};const t=nowISO();
  P.items.forEach(it=>{
    if(it.action==='skip'||it.status==='invalid'){skipped++;return}
    const q=clone(it.v.quiz);let subj=it.subj||findSubject(q.subject);
    if(!subj){const key=norm(q.subject);if(!newSubj[key]){subj=createSubject(q.subject);newSubj[key]=subj}else subj=newSubj[key]}
    const rec={...q,subject:subj.name,subjectId:subj.id,createdAt:t,updatedAt:t};
    if(it.action==='import'){if(S.quizzes[q.quizId]){skipped++;return}S.quizzes[q.quizId]=rec;added++}
    else if(it.action==='replace'){const old=S.quizzes[q.quizId];rec.createdAt=old?old.createdAt:t;S.quizzes[q.quizId]=rec;replaced++}
    else if(it.action==='copy'){rec.quizId=uniqueQuizId(q.quizId);rec.title=q.title+' (copy)';S.quizzes[rec.quizId]=rec;copied++}
  });
  pendingImport=null;save();closeModal();render();
  alertBox('✅ Import finished',`<p>${added} added · ${copied} copied · ${replaced} replaced · ${skipped} skipped${Object.keys(newSubj).length?`<br>New subject(s): ${Object.values(newSubj).map(s=>esc(s.name)).join(', ')}`:''}</p>`);
}
function createSubject(name){
  let base=String(name).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)||'SUB',id=base,n=2;while(subjById(id)){id=base+n;n++}
  const cols=['#ff1744','#2962ff','#ff6d00','#00c853','#aa00ff','#00b8d4','#f50057','#ffd600'];
  const s={id,name:String(name).trim(),short:base,icon:'📘',color:cols[S.subjects.length%cols.length],aliases:[],hidden:false,order:Math.max(-1,...S.subjects.map(x=>x.order))+1};
  S.subjects.push(s);return s;
}
function toSpecQuiz(q){const o={quizId:q.quizId,subject:subjectName(q.subjectId),year:q.year,chapter:q.chapter};if(q.topic)o.topic=q.topic;Object.assign(o,{title:q.title,difficulty:q.difficulty,questions:q.questions.map(x=>{const o={id:x.id,question:x.question,options:{...x.options},answer:x.answer,explanation:x.explanation};if(x.link){o.link=x.link;if(x.linkText)o.linkText=x.linkText}return o})});return o}

function stamp(){const d=new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())}
function download(name,obj){

  const warn=[];
  red.forEach(r=>{if(Math.abs(r.rp/s.rpPerRM-r.rm)>0.001)warn.push(`${r.rp} RP → ${RM(r.rm)} does not match ${s.rpPerRM} RP = RM1`);if(r.rm>s.monthlyBudgetRM)warn.push(`${RM(r.rm)} option is above the monthly budget and can never be redeemed`)});
  if(!await confirmBox({title:'Save settings?',body:`<p class="small">New rules apply from now on. RP already earned is not changed.</p>${warn.length?`<div class="warnt">${warn.map(esc).join('<br>')}</div>`:''}`,ok:'Save'}))return;
  S.settings=s;save();render();toast('✅ Settings saved','ok');
}
async function forgotPin(){
  const r=S.settings.recovery;
  if(r){modal(`<h3>Forgot PIN</h3><label class="f">Enter your recovery word</label><input class="in-f" id="rec-in" autocomplete="off"><div class="two mt2"><button class="btn ghost" data-a="mcancel">Cancel</button><button class="btn g" data-a="recGo">Reset PIN</button></div>`);return}
  if(!await confirmBox({title:'Reset parent PIN?',body:'<p>No recovery word was set. You can reset the PIN to <b>1234</b>.</p><p class="small">This reset is logged and shown as a warning inside Parent Mode, so a parent will always see that it happened.</p>',ok:'Reset PIN',danger:true,typed:'RESET PIN'}))return;
  S.settings.pin='1234';S.settings.pinIsDefault=true;S.meta.pinResetAt=nowISO();S.meta.pinFails=0;S.meta.pinLockUntil=0;save();render();toast('PIN reset to 1234 (logged)','gold',4000);
}
A.recGo=()=>{const v=($('#rec-in').value||'').trim().toLowerCase();if(v&&v===String(S.settings.recovery).trim().toLowerCase()){S.settings.pin='1234';S.settings.pinIsDefault=true;S.meta.pinResetAt=nowISO();save();closeModal();render();toast('PIN reset to 1234 – change it now','gold',4000)}else toast('Recovery word is wrong','bad')};

/* ------------------------------ Events ------------------------------ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const fn=A[el.dataset.a];if(!fn)return;
  if(el.dataset.a!=='mbackdrop')e.preventDefault();
  fn(el,e);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-change]');if(!el)return;
  if(el.dataset.change==='qfilter'){view.params.filter=el.value;render()}
  if(el.dataset.change==='impAction'&&pendingImport){pendingImport.items[+el.dataset.k].action=el.value;const box=$('.modal div[style*="max-height"]');const sc=box?box.scrollTop:0;showImportPreview();const b2=$('.modal div[style*="max-height"]');if(b2)b2.scrollTop=sc}
});
document.addEventListener('input',e=>{if(editDraft&&e.target.closest('[data-dirty]'))editDraft.dirty=true});
$('#filepick').addEventListener('change',async e=>{
  const files=Array.from(e.target.files||[]);if(!files.length)return;
  const payloads=await Promise.all(files.map(f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res({name:f.name,text:String(r.result)});r.onerror=()=>res({name:f.name,text:''});r.readAsText(f)})));
  e.target.value='';
  if(filePurpose==='restore'){
    const p=payloads[0];let obj;try{obj=parseJSONText(p.text)}catch(err){alertBox('❌ Cannot read file',`<div class="err">${esc(err.message)}</div>`);return}
    if(obj&&obj.type===BACKUP_TYPE)beginRestore(obj,p.name);
    else if(await confirmBox({title:'Not a full backup',body:'This file looks like quiz data, not a full backup. Import it as quizzes instead?',ok:'Import quizzes'}))handleImportPayloads(payloads);
  } else handleImportPayloads(payloads);
});
window.addEventListener('storage',e=>{
  if(e.key!==STORE_KEY||!e.newValue)return;
  try{S=migrate(JSON.parse(e.newValue));toast('Data was updated in another tab – refreshed','gold',4000);if(view.name!=='quiz')render()}catch(_){}
});
A.pApprove=async el=>{window.__txNote='';await _paWrap(el)};
async function _paWrap(el){
  const t=S.wallet.transactions.find(x=>x.id===el.dataset.id);if(!t||t.status!=='pending'){toast('Already handled','bad');return}
  const mk=monthKey(),used=redeemedRM(mk),av=availableRP();
  if(av<t.rp){alertBox('Cannot approve',`${esc(SN())} has only ${fmtN(av)} RP available; this request needs ${fmtN(t.rp)} RP.`);return}
  if(used+t.rm>S.settings.monthlyBudgetRM){alertBox('Cannot approve',`Approving would exceed the monthly budget: ${RM(used)} already approved in ${monthName(mk)} + ${RM(t.rm)} > ${RM(S.settings.monthlyBudgetRM)}.`);return}
  if(!await confirmBox({title:`Approve ${RM(t.rm)}?`,body:`<p>${fmtN(t.rp)} RP will be deducted now (${fmtN(av)} → ${fmtN(av-t.rp)} RP).</p><p class="small">Monthly cash after approval: ${RM(used+t.rm)} / ${RM(S.settings.monthlyBudgetRM)}. Mark it as paid after you give the money.</p><label class="f">Note (optional)</label><input class="in-f" id="tx-note">`,ok:'Approve'}))return;
  if(t.status!=='pending')return;
  if(availableRP()<t.rp||redeemedRM(mk)+t.rm>S.settings.monthlyBudgetRM){toast('Limits changed – not approved','bad');return}
  t.note=window.__txNote||'';
  S.wallet.rpSpent+=t.rp;t.rpDeducted=true;t.status='approved';t.approvedAt=nowISO();t.approvedMonth=mk;t.history.push({s:'approved',at:t.approvedAt});
  checkBadges();save();render();toast('✅ Approved – RP deducted','ok');
}
A.pReject=async el=>{
  window.__txNote='';const t=S.wallet.transactions.find(x=>x.id===el.dataset.id);if(!t||t.status!=='pending')return;
  if(!await confirmBox({title:'Reject request?',body:`<p>${RM(t.rm)} · ${fmtN(t.rp)} RP. No RP will be deducted.</p><label class="f">Reason (optional, ${esc(SN())} can see it)</label><input class="in-f" id="tx-note">`,ok:'Reject',danger:true}))return;
  if(t.status!=='pending')return;
  t.note=window.__txNote||'';t.status='rejected';t.rejectedAt=nowISO();t.history.push({s:'rejected',at:t.rejectedAt});save();render();
};

/* ------------------------------ Built-in quizzes ------------------------------ */
let builtinReport={count:0,added:0,updated:0,errors:[]};
function loadBuiltins(){
  const el=document.getElementById('builtin-quizzes');if(!el)return;
  let list;try{list=JSON.parse(el.textContent.trim()||'[]')}catch(e){builtinReport.errors.push('Built-in quiz block is not valid JSON: '+e.message);return}
  if(!Array.isArray(list))list=extractQuizList(list)||[];
  const removed=S.meta.builtinRemoved||[];let changed=false;const t=nowISO();
  list.forEach((raw,i)=>{
    const v=validateQuiz(raw,i);builtinReport.count++;
    if(v.errors.length){builtinReport.errors.push(`${raw&&raw.quizId||'#'+(i+1)}: ${v.errors[0]}`);return}
    const q=v.quiz;if(removed.includes(q.quizId))return;
    const ex=S.quizzes[q.quizId];
    if(ex&&!ex.builtIn)return; // a parent-imported or parent-edited quiz with the same ID is never overwritten
    let subj=findSubject(q.subject);if(!subj)subj=createSubject(q.subject);
    const rec={...q,subject:subj.name,subjectId:subj.id,builtIn:true,createdAt:ex?ex.createdAt:t,updatedAt:t};
    if(!ex){S.quizzes[q.quizId]=rec;builtinReport.added++;changed=true}
    else if(!sameQuizContent(ex,q)||ex.subjectId!==subj.id){S.quizzes[q.quizId]=rec;builtinReport.updated++;changed=true} // newer file version: content updated, Adam's scores kept
  });
  if(changed)save();
}
/* ------------------------------ Boot ------------------------------ */
load();
loadBuiltins();

   <button class="btn y block big mt" data-a="saveName">LET'S GO! 🚀</button>`);
  setTimeout(()=>{const i=$('#nm-in');i&&i.focus()},100);
}
